name: jscpd CI

# CI for the v4 TypeScript engine (maintenance branch `master-v4`).

on:
  push:
    branches:
      - master-v4
  pull_request:
    branches:
      - master-v4

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      checks: write # dorny/test-reporter posts check runs

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
        package-manager-cache: false

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build
      run: pnpm build

    - name: Lint
      run: pnpm lint

    - name: Test
      run: pnpm test -- --reporter=default --reporter=junit --outputFile=test-results/junit.xml

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-node-${{ matrix.node-version }}
        path: '**/test-results/junit.xml'
        if-no-files-found: warn

    - name: Test Report
      if: always()
      continue-on-error: true
      uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
      with:
        name: Node.js Tests (${{ matrix.node-version }})
        path: '**/test-results/junit.xml'
        reporter: java-junit
        fail-on-error: false

    # ── Smoke test: run the built CLI against the fixtures corpus ──
    # `fixtures/` is a known-duplicated corpus (366 files across 126 formats,
    # ~211 clones). The built binary must find clones there and every bundled
    # file reporter must write its output without crashing.
    - name: Smoke test (console + json)
      run: |
        rm -rf smoke-report
        node apps/jscpd/bin/jscpd ./fixtures --reporters console,json --output smoke-report --noTips
        clones=$(jq -r '.statistics.total.clones' smoke-report/jscpd-report.json)
        sources=$(jq -r '.statistics.total.sources' smoke-report/jscpd-report.json)
        echo "smoke: ${clones} clones in ${sources} files"
        jq -e '.statistics.total.clones > 0 and .statistics.total.sources > 0' smoke-report/jscpd-report.json > /dev/null
        jq -e '.duplicates | length > 0' smoke-report/jscpd-report.json > /dev/null

    - name: Smoke test (html, sarif, badge, markdown, xml, csv reporters)
      run: |
        node apps/jscpd/bin/jscpd ./fixtures --reporters html,sarif,badge,markdown,xml,csv --output smoke-report --noTips --silent
        for f in html/index.html jscpd-sarif.json jscpd-badge.svg jscpd-report.md jscpd-report.xml jscpd-report.csv; do
          test -s "smoke-report/$f" || { echo "missing reporter output: smoke-report/$f"; exit 1; }
        done
        jq -e '.runs[0].results | length > 0' smoke-report/jscpd-sarif.json > /dev/null
        rm -rf smoke-report

    - name: Dogfood (repo config)
      run: ./apps/jscpd/bin/jscpd ./fixtures
