name: jscpd CI

on: [push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      checks: write # dorny/test-reporter posts check runs

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: ${{ matrix.node-version }}
        package-manager-cache: false

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build
      run: pnpm build

    - name: Lint
      run: pnpm lint

    - name: Test
      run: pnpm test -- --reporter=default --reporter=junit --outputFile=test-results/junit.xml

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-node-${{ matrix.node-version }}
        path: '**/test-results/junit.xml'
        if-no-files-found: warn

    - name: Test Report
      if: always()
      continue-on-error: true
      uses: dorny/test-reporter@3eeb9fc888e82e8be2fb356bbeec2750231672bc # v1
      with:
        name: Node.js Tests (${{ matrix.node-version }})
        path: '**/test-results/junit.xml'
        reporter: java-junit
        fail-on-error: false

    - name: jscpd
      run: ./apps/jscpd/bin/jscpd ./fixtures
