name: npm-rust-publish

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Read version
        id: version
        working-directory: rust
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version=$(node -p "require('./package.json').version")
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target.key }}
    needs: version
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm publish --provenance
      checks: write # dorny/test-reporter posts check runs
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        target:
          - key: linux-x64-gnu
            packageName: jscpd-linux-x64-gnu
            os: linux
            cpu: x64
            libc: glibc
            rustTarget: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - key: linux-arm64-gnu
            packageName: jscpd-linux-arm64-gnu
            os: linux
            cpu: arm64
            libc: glibc
            rustTarget: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - key: linux-x64-musl
            packageName: jscpd-linux-x64-musl
            os: linux
            cpu: x64
            libc: musl
            rustTarget: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - key: darwin-arm64
            packageName: jscpd-darwin-arm64
            os: darwin
            cpu: arm64
            rustTarget: aarch64-apple-darwin
            runner: macos-latest
          - key: darwin-x64
            packageName: jscpd-darwin-x64
            os: darwin
            cpu: x64
            rustTarget: x86_64-apple-darwin
            runner: macos-latest
          - key: windows-x64-msvc
            packageName: jscpd-windows-x64-msvc
            os: win32
            cpu: x64
            rustTarget: x86_64-pc-windows-msvc
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Check platform package already published (idempotency)
        id: platform-package
        run: |
          version="${{ needs.version.outputs.version }}"
          package_name="${{ matrix.target.packageName }}"
          if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
            echo "${package_name}@${version} is already published; skipping build"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # On a resumed release (platform package already on npm from an earlier
      # run), the build is skipped — but the release job attaches assets from
      # THIS run's artifacts only. Repack the published npm binary as the
      # release-asset tarball so resumed releases still get all assets.
      - name: Repack published binary for release assets
        if: steps.platform-package.outputs.published == 'true'
        run: |
          version="${{ needs.version.outputs.version }}"
          package_name="${{ matrix.target.packageName }}"
          mkdir -p rust/target/release-assets repack
          npm pack "${package_name}@${version}" --pack-destination repack >/dev/null
          tar -xzf repack/*.tgz -C repack
          binary_name="jscpd"
          if [ "${{ matrix.target.os }}" = "win32" ]; then
            binary_name="jscpd.exe"
          fi
          bin_path=$(find repack/package -name "$binary_name" -type f | head -1)
          [ -n "$bin_path" ] || { echo "::error::${binary_name} not found in ${package_name}@${version}"; exit 1; }
          chmod +x "$bin_path"
          tar -czf "rust/target/release-assets/jscpd-${{ matrix.target.key }}.tar.gz" \
            -C "$(dirname "$bin_path")" "$binary_name"

      - name: Upload binary artifact (from published package)
        if: steps.platform-package.outputs.published == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jscpd-binary-${{ matrix.target.key }}
          path: rust/target/release-assets/jscpd-${{ matrix.target.key }}.tar.gz
          retention-days: 1

      - name: Install Rust toolchain
        if: steps.platform-package.outputs.published != 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97"
          targets: ${{ matrix.target.rustTarget }}

      - name: Cache Cargo registry and target
        if: steps.platform-package.outputs.published != 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "rust -> rust/target"
          cache-on-failure: true

      - name: Install cross-compilation tools (Linux ARM64)
        if: steps.platform-package.outputs.published != 'true' && matrix.target.key == 'linux-arm64-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install musl tools
        if: steps.platform-package.outputs.published != 'true' && matrix.target.key == 'linux-x64-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cargo-nextest
        if: steps.platform-package.outputs.published != 'true'
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: nextest

      - name: Test
        # Skip for darwin-x64: cross-compiled from ARM Mac, tests cannot run on host
        if: steps.platform-package.outputs.published != 'true' && matrix.target.key != 'darwin-x64'
        working-directory: rust
        run: cargo nextest run --workspace --locked --target ${{ matrix.target.rustTarget }} --profile ci

      - name: Upload test results
        if: always() && steps.platform-package.outputs.published != 'true' && matrix.target.key != 'darwin-x64'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextest-results-${{ matrix.target.key }}
          path: rust/target/nextest/ci/nextest.xml
          if-no-files-found: warn

      - name: Test Report
        if: always() && steps.platform-package.outputs.published != 'true' && matrix.target.key != 'darwin-x64'
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Rust Tests (${{ matrix.target.key }})
          path: rust/target/nextest/ci/nextest.xml
          reporter: java-junit
          fail-on-error: false

      - name: Build
        if: steps.platform-package.outputs.published != 'true'
        working-directory: rust
        run: cargo build --release --locked --target ${{ matrix.target.rustTarget }} -p jscpd

      - name: Create platform package
        if: steps.platform-package.outputs.published != 'true'
        id: package
        working-directory: rust
        run: |
          package_dir="$(
            node scripts/npm-prebuilt-package.mjs \
              --target "${{ matrix.target.key }}" \
              --bin-dir "target/${{ matrix.target.rustTarget }}/release" \
              --out-dir "target/npm-prebuilt"
          )"
          echo "package_dir=${package_dir}" >> "$GITHUB_OUTPUT"

      - name: Smoke test (non-Windows)
        if: steps.platform-package.outputs.published != 'true' && matrix.target.os != 'win32'
        working-directory: rust
        run: |
          version="${{ needs.version.outputs.version }}"
          binary="./target/${{ matrix.target.rustTarget }}/release/jscpd"
          BUILT_VERSION=$("$binary" --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "NOT_FOUND")
          echo "Built: ${BUILT_VERSION}, Expected: ${version}"
          [ "$BUILT_VERSION" = "${version}" ] || { echo "Version mismatch!"; exit 1; }

      - name: Archive binary for release assets
        if: steps.platform-package.outputs.published != 'true'
        working-directory: rust
        run: |
          mkdir -p target/release-assets
          binary_name="jscpd"
          if [ "${{ matrix.target.os }}" = "win32" ]; then
            binary_name="jscpd.exe"
          fi
          tar -czf "target/release-assets/jscpd-${{ matrix.target.key }}.tar.gz" \
            -C "target/${{ matrix.target.rustTarget }}/release" \
            "$binary_name"

      - name: Upload binary artifact
        if: steps.platform-package.outputs.published != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jscpd-binary-${{ matrix.target.key }}
          path: rust/target/release-assets/jscpd-${{ matrix.target.key }}.tar.gz
          retention-days: 1

      - name: Install pnpm
        if: steps.platform-package.outputs.published != 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node
        if: steps.platform-package.outputs.published != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Publish platform package
        if: steps.platform-package.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: rust
        run: |
          version="${{ needs.version.outputs.version }}"
          package_name="${{ matrix.target.packageName }}"
          package_dir="${{ steps.package.outputs.package_dir }}"
          if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
            echo "${package_name}@${version} is already published; skipping"
            exit 0
          fi
          npm publish "$package_dir" --access public --provenance

  publish-main:
    name: publish main cpd package
    needs:
      - version
      - build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # npm publish --provenance
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify all platform packages are published
        working-directory: rust
        run: |
          version="${{ needs.version.outputs.version }}"
          targets=$(node -e "
            const t = require('./npm/prebuilt-targets.json');
            Object.values(t).forEach(v => console.log(v.packageName));
          ")
          missing=0
          for pkg in $targets; do
            if npm view "${pkg}@${version}" version >/dev/null 2>&1; then
              echo "${pkg}@${version} is published"
            else
              missing=$((missing + 1))
              echo "::error title=Missing platform package::${pkg}@${version} is not published"
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "Missing ${missing} platform packages; cannot publish main package"
            exit 1
          fi

      - name: Publish main cpd package
        working-directory: rust
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${{ needs.version.outputs.version }}"
          if npm view "cpd@${version}" version >/dev/null 2>&1; then
            echo "cpd@${version} is already published; skipping"
            exit 0
          fi
          npm publish --access public --provenance

  publish-jscpd:
    name: publish jscpd wrapper package
    needs:
      - version
      - publish-main
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm publish --provenance
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install cpd globally for fixture check
        working-directory: rust
        run: |
          version="${{ needs.version.outputs.version }}"
          # ponytail: npm registry CDN propagates with eventual consistency;
          # a freshly published cpd@${version} may 404 for seconds-to-minutes.
          # Poll npm view before installing. Switch to a registry webhook if
          # propagation latency ever exceeds ~5 minutes regularly.
          for i in $(seq 1 30); do
            if npm view "cpd@${version}" version >/dev/null 2>&1; then
              npm install -g "cpd@${version}"
              exit 0
            fi
            echo "Attempt $i/30: waiting for cpd@${version} to propagate on npm..."
            sleep 10
          done
          echo "::error::cpd@${version} never became installable on npm after ~5 minutes"
          exit 1

      - name: Fixture check
        working-directory: rust
        run: |
          jscpd ../fixtures --silent --reporters json || true

      - name: Setup Node.js for publish
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Publish jscpd package
        working-directory: rust/jscpd
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${{ needs.version.outputs.version }}"
          if npm view "jscpd@${version}" version >/dev/null 2>&1; then
            echo "jscpd@${version} is already published; skipping"
            exit 0
          fi
          npm publish --access public --provenance
