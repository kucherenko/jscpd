name: Nightly audit

# Dependency vulnerability checks for the v4 TypeScript packages. Runs on a
# schedule so newly published advisories surface without a code change.
#
# Note: GitHub only fires `schedule` triggers from the repository's default
# branch, so on `master-v4` this workflow runs via workflow_dispatch (pick the
# `master-v4` branch when dispatching).

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    name: pnpm audit (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: pnpm

      - name: pnpm audit
        run: pnpm audit --audit-level high
