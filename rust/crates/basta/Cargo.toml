[package]
name = "basta"
version = "0.3.0"
edition.workspace = true
publish = false
rust-version.workspace = true
description = "Dead code detection — unused files, exports, symbols and imports across JavaScript, TypeScript, Vue, Svelte, Astro and Python, and Rust through cargo's diagnostics"
homepage.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://jscpd.dev"
keywords = ["dead-code", "unused-code", "static-analysis", "unused-exports", "basta"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "basta"
path = "src/lib.rs"

[[bin]]
name = "basta"
path = "src/main.rs"

[dependencies]
globset = "0.4"
ignore = "0.4"
cpd-core = { version = "0.1.18", path = "../cpd-core" }
cpd-finder = { version = "0.1.18", path = "../cpd-finder" }
cpd-reporter = { version = "0.1.19", path = "../cpd-reporter" }
cpd-tokenizer = { version = "0.1.17", path = "../cpd-tokenizer" }
oxc_allocator = "0.150"
oxc_ast = "0.150"
oxc_ast_visit = "0.150"
oxc_parser = "0.150"
oxc_semantic = "0.150"
oxc_span = "0.150"
oxc_syntax = "0.150"
ruff_python_ast = "0.0.13"
ruff_python_parser = "0.0.14"
rustc-hash = "2"
chrono = "0.4"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"

[dev-dependencies]
serde_json = "1"
