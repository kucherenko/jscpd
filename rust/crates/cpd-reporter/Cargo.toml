[package]
name = "cpd-reporter"
version = "0.1.11"
edition.workspace = true
publish = false
rust-version.workspace = true
description = "Output format reporters for cpd"
homepage.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/cpd-reporter"
keywords = ["duplicate-code", "clone-detection", "sarif", "cpd", "static-analysis"]
categories = ["development-tools"]

[dependencies]
cpd-core = { version = "0.1.10", path = "../cpd-core" }
cpd-finder = { version = "0.1.13", path = "../cpd-finder" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.41", features = ["serialize"] }
csv = "1"
askama = "0.16"
thiserror = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
