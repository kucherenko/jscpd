[package]
name = "cpd-tokenizer"
version = "0.1.19"
edition.workspace = true
publish = false
rust-version.workspace = true
description = "Source code tokenizers for cpd"
homepage.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/cpd-tokenizer"
keywords = ["duplicate-code", "clone-detection", "tokenizer", "cpd", "static-analysis"]
categories = ["development-tools", "parsing"]

[dependencies]
cpd-core = { version = "0.1.20", path = "../cpd-core" }
oxc_parser = "0.152"
oxc_allocator = "0.152"
oxc_span = "0.152"
oxc_ast = "0.152"
oxc_ast_visit = "0.152"
oxc_syntax = "0.152"
# Python functions for --similarity and --semantic
ruff_python_ast = "0.0.15"
ruff_python_parser = "0.0.15"
ruff_text_size = "0.0.15"
log = "0.4"
regex = "1"

