[package]
name = "cpd-tokenizer"
version = "0.1.17"
edition.workspace = true
publish = false
rust-version.workspace = true
description = "Source code tokenizers for cpd"
homepage.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/cpd-tokenizer"
keywords = ["duplicate-code", "clone-detection", "tokenizer", "cpd", "static-analysis"]
categories = ["development-tools", "parsing"]

[dependencies]
cpd-core = { version = "0.1.18", path = "../cpd-core" }
oxc_parser = "0.151"
oxc_allocator = "0.151"
oxc_span = "0.151"
oxc_ast = "0.151"
oxc_ast_visit = "0.151"
oxc_syntax = "0.151"
log = "0.4"
regex = "1"
ruff_python_ast = "0.0.15"
ruff_python_parser = "0.0.15"
# Function extraction for --semantic in languages without a parser of our
# own: one tree-sitter grammar per language.
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-language = "0.1"
tree-sitter-php = "0.24"
tree-sitter-ruby = "0.23"
tree-sitter-scala = "0.26"
tree-sitter-swift = "0.7"

