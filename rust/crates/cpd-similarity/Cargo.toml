[package]
name = "cpd-similarity"
version = "0.1.0"
edition.workspace = true
publish = false
rust-version.workspace = true
description = "Structural similarity of functions for cpd: normalized syntax trees compared by their subtrees"
homepage.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/cpd-similarity"
keywords = ["duplicate-code", "clone-detection", "similarity", "cpd", "static-analysis"]
categories = ["development-tools"]

[dependencies]
cpd-core = { version = "0.1.21", path = "../cpd-core" }
cpd-tokenizer = { version = "0.1.20", path = "../cpd-tokenizer" }
rustc-hash = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# One grammar per language with units; Clojure has a reader of its own
tree-sitter = "0.27"
tree-sitter-language = "0.1"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-php = "0.24"
tree-sitter-ruby = "0.23"
tree-sitter-scala = "0.26"
tree-sitter-swift = "0.7"
