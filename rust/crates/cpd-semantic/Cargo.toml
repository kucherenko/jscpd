[package]
name = "cpd-semantic"
version = "0.1.0"
edition.workspace = true
publish = false
rust-version.workspace = true
description = "Semantic (Type-4) clones for cpd: functions compared by code embeddings"
homepage.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/cpd-semantic"
keywords = ["duplicate-code", "clone-detection", "embeddings", "cpd", "static-analysis"]
categories = ["development-tools"]

[dependencies]
cpd-core = { version = "0.1.18", path = "../cpd-core" }
cpd-tokenizer = { version = "0.1.17", path = "../cpd-tokenizer" }
cpd-finder = { version = "0.1.18", path = "../cpd-finder" }
rayon = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Functions of Python (ruff) and of the languages below (one tree-sitter
# grammar each); JavaScript and TypeScript come from cpd-tokenizer's oxc
# extractor.
ruff_python_ast = "0.0.15"
ruff_python_parser = "0.0.15"
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-language = "0.1"
tree-sitter-php = "0.24"
tree-sitter-ruby = "0.23"
tree-sitter-scala = "0.26"
tree-sitter-swift = "0.7"
# The local provider: the embedding model runs in-process.
candle-core = "0.11"
candle-nn = "0.11"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
sha2 = "0.10"

# Apple's Accelerate framework (BLAS on the matrix units) for the local
# embedding model's matrix products on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["accelerate"] }
candle-nn = { version = "0.11", features = ["accelerate"] }

# HTTP, for model downloads and the embeddings API. Windows and macOS use the
# system TLS stack and its certificate store (no C toolchain for ring on
# windows-arm64, and corporate roots work); Linux uses rustls with Mozilla's
# roots, which links statically into the musl builds.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
