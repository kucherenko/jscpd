[package]
name = "rust-cpd-finder-example"
version = "0.0.0"
edition = "2024"
publish = false
description = "Minimal example of embedding the jscpd v5 engine via the cpd-finder crate"

[dependencies]
cpd-finder = "0.1"

# Keep this example out of any enclosing Cargo workspace.
[workspace]

# To build against the crates in this repository instead of crates.io (e.g. to
# try unpublished changes), uncomment the block below.
# [patch.crates-io]
# cpd-core = { path = "../../rust/crates/cpd-core" }
# cpd-tokenizer = { path = "../../rust/crates/cpd-tokenizer" }
# cpd-finder = { path = "../../rust/crates/cpd-finder" }
